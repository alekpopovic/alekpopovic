<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Aleksandar Popovic</title>
  <desc id="desc">Software engineer. Product builder. Systems thinker. A cream banner with blue lettering, a purple book, connected nodes, and an orange flower.</desc>
  <style>
