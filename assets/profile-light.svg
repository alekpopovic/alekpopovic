    <text class="ink" x="1160" y="44" font-size="15" text-anchor="end">ALEKSINAC, SERBIA</text>
    <text class="ink" x="40" y="142" font-size="60" font-weight="800" letter-spacing="-2">Aleksandar</text>
    <text class="ink" x="40" y="206" font-size="60" font-weight="800" letter-spacing="-2">Popovic<tspan class="accent">.</tspan></text>
    <text class="body" x="43" y="248" font-size="22">Software engineer. Product builder. Systems thinker.</text>
